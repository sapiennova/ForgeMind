name: Security checks

on:
  pull_request:
    branches: [Development]
  push:
    branches: [Development]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Dependency audit and static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install backend dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pip-audit bandit
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Run Bandit
        run: bandit -q -r backend/app -ll
